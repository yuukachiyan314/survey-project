<div class="page">
  <div class="card">
    <div class="h1">
      後台｜{{ isNew ? '新增問卷' : (isQuestionsMode ? '編輯題目' : '編輯問卷') }}
    </div>

    <div class="toolbar-actions">
      <a class="btn btn-ghost" routerLink="/admin/surveys">回列表</a>
      <a class="btn btn-ghost" *ngIf="!isNew && id" [routerLink]="['/admin/surveys', id, 'edit']">基本資料</a>
      <a class="btn btn-ghost" *ngIf="!isNew && id" [routerLink]="['/admin/surveys', id, 'questions']">題目設計</a>
      <a class="btn btn-primary" *ngIf="!isNew && id" [routerLink]="['/admin/surveys', id, 'preview']">看預覽</a>
    </div>
  </div>

  <div class="card form-card">
    <div class="section-title">基本資料</div>

    <div class="form-grid">
      <div class="form-group full">
        <label class="form-label">標題</label>
        <input class="input" [(ngModel)]="title" />
      </div>

      <div class="form-group full">
        <label class="form-label">描述</label>
        <textarea class="textarea" [(ngModel)]="description" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">開始時間</label>
        <input class="datetime" type="datetime-local" [(ngModel)]="startTimeInput" />
      </div>

      <div class="form-group">
        <label class="form-label">結束時間</label>
        <input class="datetime" type="datetime-local" [(ngModel)]="endTimeInput" />
      </div>

      <div class="form-group full">
        <label class="check-line">
          <input type="checkbox"
                 [checked]="isPublished===1"
                 (change)="isPublished = $any($event.target).checked ? 1 : 0" />
          <span>發布</span>
        </label>
      </div>
    </div>

    <hr class="hr" />

    <div *ngIf="isNew || isQuestionsMode" class="question-block">
      <div class="section-title" style="font-size:20px;">題目設計</div>

      <div *ngFor="let q of questions; let i = index" class="question-card">
        <div class="question-head">
          <div class="question-title">第 {{ i + 1 }} 題</div>
          <div class="question-tools">
            <button class="btn btn-danger-soft" type="button" (click)="removeQuestion(i)">刪題</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">題目標題</label>
          <input class="input" [(ngModel)]="q.title" />
        </div>

        <div class="inline-row" style="margin-top:14px;">
          <div class="form-group" style="min-width:140px;">
            <label class="form-label">題型</label>
            <select class="select" [(ngModel)]="q.questionType" (change)="onTypeChange(i)">
              <option value="single">單選</option>
              <option value="multiple">複選</option>
              <option value="text">簡答</option>
            </select>
          </div>

          <label class="check-line" style="margin-bottom: 4px;">
            <input type="checkbox"
                   [checked]="q.isRequired===1"
                   (change)="q.isRequired = $any($event.target).checked ? 1 : 0" />
            <span>必填</span>
          </label>
        </div>

        <div *ngIf="q.questionType !== 'text'" style="margin-top:16px;">
          <div class="question-head" style="margin-bottom:10px;">
            <div class="form-label">選項</div>
            <button class="btn btn-ghost" type="button" (click)="addOption(i)">＋ 新增選項</button>
          </div>

          <div *ngFor="let o of q.options; let j = index" class="option-row">
            <input class="input" [(ngModel)]="o.optionText" />
            <button class="btn btn-danger-soft" type="button" (click)="removeOption(i, j)">刪</button>
          </div>
        </div>

        <div *ngIf="q.questionType === 'text'" class="muted" style="margin-top:12px;">此題為簡答題</div>
      </div>

      <div class="bottom-actions">
        <button class="btn btn-ghost" type="button" (click)="addQuestion()">＋ 新增題目</button>
      </div>
    </div>

    <div class="bottom-actions">
      <ng-container *ngIf="isNew">
        <button class="btn btn-primary" type="button" (click)="save(false)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存草稿' }}
        </button>

        <button class="btn" type="button" (click)="save(true)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存並預覽' }}
        </button>
      </ng-container>

      <ng-container *ngIf="!isNew && !isQuestionsMode">
        <button class="btn btn-primary" type="button" (click)="save(false)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存' }}
        </button>

        <button class="btn" type="button" (click)="save(true)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存並預覽' }}
        </button>
      </ng-container>

      <ng-container *ngIf="!isNew && isQuestionsMode">
        <button class="btn btn-primary" type="button" (click)="saveQuestions(false)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存題目' }}
        </button>

        <button class="btn" type="button" (click)="saveQuestions(true)" [disabled]="loading">
          {{ loading ? '儲存中…' : '儲存題目並預覽' }}
        </button>
      </ng-container>
    </div>
  </div>
</div>
