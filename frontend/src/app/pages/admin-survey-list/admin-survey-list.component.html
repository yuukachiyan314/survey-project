<div class="page">
  <div class="card">
    <div class="h1">後台｜問卷管理</div>

    <div class="actions">
      <a class="link" routerLink="/surveys">去前台問卷清單</a>
      <a class="link" routerLink="/admin/surveys/new">＋ 新增問卷</a>
    </div>
  </div>

  <div *ngFor="let s of surveys" class="card">
    <div class="q-title" style="font-size:18px;">{{ s.title }}</div>
    <div class="muted" *ngIf="s.description">{{ s.description }}</div>

    <div class="muted">
      期間：{{ s.startTime | date:'yyyy-MM-dd HH:mm' }} ～ {{ s.endTime | date:'yyyy-MM-dd HH:mm' }}
    </div>

    <div class="muted">
      狀態：<b>{{ s.isPublished === 1 ? '已發布' : '未發布' }}</b>
    </div>

<div class="actions">
  <button class="btn" (click)="remove(s.id)">刪除</button>

  <!-- ✅ 主要入口：直接去題目設計（你想要的「編輯」=改題目） -->
  <a class="link" [routerLink]="['/admin/surveys', s.id, 'questions']">編輯</a>

  <!-- ✅ 如果還要改標題/時間/發布，改叫「基本資料」避免誤會 -->
  <a class="link" [routerLink]="['/admin/surveys', s.id, 'edit']">基本資料</a>

  <a class="link" [routerLink]="['/admin/surveys', s.id, 'preview']">預覽</a>
  <a class="link"
   [routerLink]="['/surveys', s.id, 'results']"
   [queryParams]="{ from: 'admin' }">看統計</a>
</div>
  </div>
</div>
