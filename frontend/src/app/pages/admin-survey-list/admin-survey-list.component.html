<div class="page">
  <div class="card">
    <div class="h1">後台｜問卷管理</div>

    <div class="toolbar-actions">
      <a class="btn btn-ghost" routerLink="/surveys">去前台問卷清單</a>
      <a class="btn btn-primary" routerLink="/admin/surveys/new">＋ 新增問卷</a>
    </div>
  </div>

  <div *ngFor="let s of surveys" class="card survey-card">
    <div class="survey-row">
      <div class="survey-main">
        <div class="q-title survey-title">{{ s.title }}</div>
        <div class="muted survey-desc" *ngIf="s.description">{{ s.description }}</div>
      </div>

      <div class="survey-side">
        <div class="survey-time-label">期間</div>
        <div class="survey-time">
          {{ s.startTime | date:'yyyy-MM-dd HH:mm' }}<br>
          ～ {{ s.endTime | date:'yyyy-MM-dd HH:mm' }}
        </div>

        <div class="status-badge" [class.published]="s.isPublished === 1">
          {{ s.isPublished === 1 ? '已發布' : '未發布' }}
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn btn-danger-soft" (click)="remove(s.id)">刪除</button>

      <div class="inline-links">
        <a class="action-link" [routerLink]="['/admin/surveys', s.id, 'questions']">編輯</a>
        <a class="action-link" [routerLink]="['/admin/surveys', s.id, 'edit']">基本資料</a>
        <a class="action-link" [routerLink]="['/admin/surveys', s.id, 'preview']">預覽</a>
        <a class="action-link"
           [routerLink]="['/surveys', s.id, 'results']"
           [queryParams]="{ from: 'admin' }">看統計</a>
      </div>
    </div>
  </div>
</div>
