<h2>後台｜問卷管理</h2>

<p>
  <a routerLink="/surveys">去前台問卷清單</a>
</p>
<p><a routerLink="/admin/surveys/new">＋ 新增問卷</a></p>
<div *ngFor="let s of surveys" style="border:1px solid #ddd; padding:12px; margin:12px 0;">
  <h3>{{ s.title }}</h3>
  <p>{{ s.description }}</p>
  <p>期間：{{ s.startDate }} ～ {{ s.endDate }}</p>

  <button (click)="remove(s.id)">刪除</button>
  <a style="margin-left:12px;" [routerLink]="['/admin/surveys', s.id, 'edit']">編輯</a>
  <a style="margin-left:12px;" [routerLink]="['/surveys', s.id, 'results']">看統計</a>
</div>
